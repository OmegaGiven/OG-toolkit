#
# /etc/pacman.conf
#
# See the pacman.conf(5) manpage for option and repository directives

#
# GENERAL OPTIONS
#
[options]
HoldPkg     = pacman glibc
Architecture = auto

ParallelDownloads = 5

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# NOTE: You must run `pacman-key --init` before first using pacman; the local
# keyring can then be populated with the keys of all official Arch Linux
# packagers with `pacman-key --populate archlinux`.

#
# REPOSITORIES
#

# Local og-os repo: the OG-suite own tools (og-bar, og-settings, og-search,
# og-clip, og-notif-center, og-notify, og-files, og-links, og-apps) plus
# yay, built via ./pkgbuilds/<name>/PKGBUILD and repo-add'ed into
# ./local-repo/. Listed first so it takes precedence on any name collision.
# Unsigned local packages — TrustAll is safe here since these are only ever
# built from this repo's own PKGBUILDs, never fetched from a remote.
[ogos]
SigLevel = Optional TrustAll
Server = file:///home/omegagiven/.local/src/og-os/local-repo

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# If you want to run 32 bit applications on your x86_64 system,
# enable the multilib repositories as required here.

#[multilib]
#Include = /etc/pacman.d/mirrorlist
