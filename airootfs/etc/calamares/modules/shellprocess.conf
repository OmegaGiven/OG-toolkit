# OG-OS post-unpackfs cleanup, run in the target chroot (dontChroot: false).
#
# unpackfs's raw filesystem copy brings over live-session-only state that
# removeuser's userdel doesn't touch, because it isn't scoped to the
# liveuser *account* — it's wheel-*group*-wide, and the newly created
# real user is also in wheel (see users.conf/defaultGroups):
#   - sudoers.d/liveuser grants NOPASSWD to all of %wheel — a live-medium
#     convenience (unattended sudo on a removable disk with no password
#     set) that would otherwise silently grant passwordless root to
#     every installed system's first user. Real security hole if left.
#   - lightdm.conf.d's autologin-user=liveuser would try to autologin a
#     user that no longer exists post-removeuser (relatively harmless —
#     lightdm just falls back to its normal greeter — but sloppy to
#     leave a broken config file around).
dontChroot: false
timeout: 10
script:
    - "-rm -f /etc/sudoers.d/liveuser"
    - "-rm -f /etc/lightdm/lightdm.conf.d/50-og-os-autologin.conf"
    # /root/ogos-repo/ (~50MB of .pkg.tar.zst) only exists for
    # install-ogos.sh's pacstrap path — dead weight on an install done
    # through Calamares/unpackfs instead.
    - "-rm -rf /root/ogos-repo"
