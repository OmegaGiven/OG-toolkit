# OG-OS: copy this live session's own squashfs onto the target disk.
# Path matches archiso's install_dir=ogos convention — see
# profiledef.sh and the xorriso listing that confirmed
# /ogos/x86_64/airootfs.sfs on the built ISO.
unpack:
    -   source: "/run/archiso/bootmnt/ogos/x86_64/airootfs.sfs"
        sourcefs: "squashfs"
        destination: ""
