# OG-OS Calamares top-level config — phase 5 (OS-PLAN.md).
# Install mechanism: unpackfs (copy this live session's own squashfs onto
# the target disk), not a fresh pacstrap — matches how most squashfs-based
# Calamares distros (Manjaro, etc.) work: no network needed to install,
# and the installed system is byte-identical to this tested live image.
modules-search: [ local ]

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - initcpiocfg
  - initcpio
  - users
  - removeuser
  - shellprocess
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader
  - umount
- show:
  - finished

branding: ogos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: false
quit-at-end: false
