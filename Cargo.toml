[package]
name = "app-store"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "app-store"
path = "src/main.rs"

[dependencies]
iced = { version = "0.13", default-features = false, features = ["wgpu", "tiny-skia", "advanced", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt"] }
