[package]
name = "og-bar"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "og-bar"
path = "src/main.rs"

[[bin]]
name = "tray-spike"
path = "src/bin/tray_spike.rs"

[dependencies]
system-tray = "0.8"
og-config = { path = "../OG-toolkit/crates/og-config" }
og-theme = { path = "../OG-toolkit/crates/og-theme" }
iced = { version = "0.13", default-features = false, features = ["tiny-skia", "advanced", "tokio"] }
iced_layershell = "0.13.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt"] }
futures = "0.3"
chrono = "0.4"
libc = "0.2"
