[package]
name = "og-links"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "og-links"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["form"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
