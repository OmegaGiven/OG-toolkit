[package]
name = "og-wallpaper"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "og-wallpaper"
path = "src/main.rs"

[dependencies]
og-config = { path = "../OG-toolkit/crates/og-config" }
og-theme = { path = "../OG-toolkit/crates/og-theme" }
og-wallpaper-core = { path = "../OG-toolkit/crates/og-wallpaper-core" }
iced = { version = "0.13", default-features = false, features = ["tiny-skia", "canvas", "tokio", "image"] }
iced_layershell = "0.13.7"
rand = "0.8"

# Shared suite-wide patched copies (see OG-toolkit/vendor/README.md):
# handles zwlr_layer_surface_v1.closed so an output re-add after DPMS wake
# doesn't hang the process, plus og-bar's popup/output-name fixes.
[patch.crates-io]
layershellev = { path = "../OG-toolkit/vendor/layershellev-0.13.7" }
iced_layershell = { path = "../OG-toolkit/vendor/iced_layershell-0.13.7" }
